[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/get-products"
  status = 200

# Importer is a background function, not a page route.
# It must be triggered on a schedule (see netlify/functions/rsr-import-background.js).
# Do NOT put RSR FTP, Wasabi, or Bunny credentials in this file — use Netlify environment variables.
