[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/get-products"
  status = 200

[[redirects]]
  from = "/api/ffl-dealers"
  to = "/.netlify/functions/ffl-dealers"
  status = 200

# Importer is a background function, not a page route.
# It must be triggered on a schedule (see the background importer function).
# Do NOT put supplier, storage, or CDN credentials in this file — use Netlify environment variables.

# Fully automatic image backfill: the scheduler wakes on its own timer
# and triggers one backfill job per wake (see netlify/functions/backfill-scheduler.js).
# Schedules run in UTC and only on published deploys.
[functions."backfill-scheduler"]
  schedule = "*/30 * * * *"

# Gap-fill auto-queue (Jonathan, 2026-11-02): in-stock missing photos only,
# standard first, hi second, one batch per wake. See
# netlify/functions/gapfill-scheduler.js. Pause with GAPFILL_AUTO_PAUSED=1.
[functions."gapfill-scheduler"]
  schedule = "*/30 * * * *"
